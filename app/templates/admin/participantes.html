{% extends "base.html" %}
{% block title %}Partaideak{% endblock %}
{% block content %}
<h1>Partaideak</h1>
<p><a href="/admin/participantes/nuevo">+ Partaide berria eman</a></p>
<table class="ranking">
  <thead><tr><th>Izena</th><th>Taldeak</th><th></th></tr></thead>
  <tbody>
    {% for p in participants %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.picks|map(attribute="team.name")|join(", ") }}</td>
      <td><a href="/admin/participantes/{{ p.id }}/editar">Taldeak editatu</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
